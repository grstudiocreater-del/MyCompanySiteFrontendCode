<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="av-bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#24232b" />
      <stop offset="60%" stop-color="#141316" />
      <stop offset="100%" stop-color="#0b0a0d" />
    </radialGradient>
    <linearGradient id="av-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#3b3bf5" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="av-primary" x1="120" y1="120" x2="380" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="45%" stop-color="#3b3bf5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="av-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Base (Squircle / Rounded Box) -->
  <rect width="512" height="512" rx="128" fill="url(#av-bg)" />
  <rect x="1.5" y="1.5" width="509" height="509" rx="126.5" stroke="url(#av-border)" stroke-width="3" />

  <!-- Background Ambient Rings -->
  <circle cx="256" cy="256" r="190" stroke="#3b3bf5" stroke-opacity="0.08" stroke-width="1.5" stroke-dasharray="6 6" />
  <circle cx="256" cy="256" r="140" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />

  <!-- Center Ambient Core Glow -->
  <circle cx="256" cy="256" r="110" fill="#3b3bf5" fill-opacity="0.22" filter="blur(36px)" />

  <!-- Interlocking GR Studio Monogram -->
  <g filter="url(#av-glow)">
    <!-- Outer 'G' Path -->
    <path 
      d="M280 148 C215 148 152 198 152 262 C152 328 212 376 278 376 C336 376 374 340 374 294 L374 274 L272 274" 
      stroke="url(#av-primary)" 
      stroke-width="34" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />

    <!-- Inner 'R' Geometric Stem & Bowl -->
    <path 
      d="M272 196 L272 328 M272 196 C312 196 338 214 338 244 C338 270 314 286 272 286 M304 282 L356 376" 
      stroke="#FFFFFF" 
      stroke-width="28" 
      stroke-linecap="round" 
      stroke-linejoin="round"
      opacity="0.95"
    />

    <!-- Cyan Precision Dot -->
    <circle cx="356" cy="376" r="8" fill="#38BDF8" />
  </g>
</svg>
