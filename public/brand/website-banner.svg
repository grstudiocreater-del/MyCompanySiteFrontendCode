<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="banner-bg" cx="70%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1e1c26" />
      <stop offset="50%" stop-color="#131216" />
      <stop offset="100%" stop-color="#09080a" />
    </radialGradient>

    <!-- Electric glow accents -->
    <radialGradient id="glow-blue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B3BF5" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#3B3BF5" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>

    <!-- Mark Gradients -->
    <linearGradient id="bm-grad" x1="120" y1="120" x2="380" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="45%" stop-color="#3B3BF5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Pattern Grid -->
    <pattern id="grid-pattern" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.035" />
    </pattern>

    <!-- Glass Card Gradient -->
    <linearGradient id="glass-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="glass-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#3B3BF5" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#banner-bg)" />

  <!-- Grid overlay -->
  <rect width="1200" height="630" fill="url(#grid-pattern)" />

  <!-- Ambient Light Orbs -->
  <circle cx="950" cy="220" r="340" fill="url(#glow-blue)" filter="blur(60px)" />
  <circle cx="800" cy="420" r="260" fill="url(#glow-cyan)" filter="blur(50px)" />
  <circle cx="200" cy="150" r="250" fill="url(#glow-blue)" filter="blur(70px)" />

  <!-- Decorative Circuit / Precision Rings (Right Stage) -->
  <g transform="translate(860, 315)">
    <circle cx="0" cy="0" r="220" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1" />
    <circle cx="0" cy="0" r="170" stroke="#3B3BF5" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="8 8" />
    <circle cx="0" cy="0" r="110" stroke="#06B6D4" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="4 6" />

    <!-- 3D Glass Emblem Container -->
    <rect x="-105" y="-105" width="210" height="210" rx="52" fill="url(#glass-fill)" stroke="url(#glass-stroke)" stroke-width="1.5" />

    <!-- GR Interlocking Monogram on Right Stage -->
    <g transform="translate(-105, -105) scale(0.41)">
      <path 
        d="M280 148 C215 148 152 198 152 262 C152 328 212 376 278 376 C336 376 374 340 374 294 L374 274 L272 274" 
        stroke="url(#bm-grad)" 
        stroke-width="36" 
        stroke-linecap="round" 
        stroke-linejoin="round"
      />
      <path 
        d="M272 196 L272 328 M272 196 C312 196 338 214 338 244 C338 270 314 286 272 286 M304 282 L356 376" 
        stroke="#FFFFFF" 
        stroke-width="30" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        opacity="0.95"
      />
      <circle cx="356" cy="376" r="9" fill="#38BDF8" />
    </g>
  </g>

  <!-- Left Content Stage -->
  <g transform="translate(100, 150)">
    <!-- Pill Badge -->
    <g>
      <rect width="210" height="38" rx="19" fill="#3B3BF5" fill-opacity="0.15" stroke="#3B3BF5" stroke-opacity="0.4" stroke-width="1" />
      <circle cx="20" cy="19" r="4.5" fill="#38BDF8" />
      <text x="34" y="24" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#C7D2FE" letter-spacing="0.08em">DIGITAL STUDIO</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="115" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="64" fill="#FFFFFF" letter-spacing="-0.035em">
      GR STUDIO
    </text>
    <text x="0" y="180" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="52" fill="#3B3BF5" letter-spacing="-0.02em">
      CREATOR
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="240" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="22" fill="#A1A1AA" letter-spacing="-0.01em">
      Creative digital experiences, designed with purpose.
    </text>

    <!-- Bullet points -->
    <g transform="translate(0, 290)">
      <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="14" fill="#71717A">
        SOFTWARE EXPERIENCES <tspan fill="#3B3BF5">•</tspan> DIGITAL PRODUCTS <tspan fill="#3B3BF5">•</tspan> INTERACTIVE DESIGN
      </text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="626" width="1200" height="4" fill="url(#bm-grad)" />
</svg>
